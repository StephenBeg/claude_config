# ~/.claude/wf-gates.conf — CRAN DE CHAQUE GATE DÉTERMINISTE
#
#   block  refuse l'appel (exit 2) et renvoie la consigne au LLM   <- défaut
#   warn   laisse passer, injecte l'avertissement dans le contexte
#   off    silence
#
# Priorité : WF_GATES_OFF=1 (kill switch) > WF_GATE_<NOM>=... > ce fichier > block.
# Nom d'env = nom du gate en majuscules, tirets -> underscores (WF_GATE_MR_MERGE).
#
# ATTENTION — un préfixe d'environnement sur une commande NE PARVIENT PAS au
# hook : le harness lance le hook dans un process séparé, pas comme enfant de la
# commande. `WF_GATE_COVERAGE=off git commit …` ne désactive donc RIEN. Pour
# lever un gate ponctuellement : éditer la ligne ci-dessous (effet immédiat, le
# fichier est relu à chaque appel). Pour le lever sur toute une session :
# l'exporter avant de lancer Claude Code, ou le poser dans settings.json > env.
#
# ---- GIT WORKFLOW (CLAUDE.md) ------------------------------------------------
master-write   = block   # écriture Bash dans le repo principal sur master
master-push    = block   # push depuis/vers master
worktree-form  = block   # worktree hors ~/worktrees/malt ou sans base origin/master
coauthor       = block   # Co-Authored-By dans un commit
mr-create      = block   # MR sans reviewer @stephen.begot / titre [PREFIX] / label
rebase-skipci  = block   # rebase d'API sans skip_ci=true
mr-merge       = block   # merge sans squash / rebase / Approved frais / pipeline verte
                         # (fail closed : si Approved+pipeline sont INVÉRIFIABLES, refus)

# ---- COUVERTURE & VÉRIFICATION (CLAUDE.md, /dev steps 4-5) -------------------
coverage       = block   # commit ajoutant du code source sans aucun test indexé
pre-push       = block   # 1er push sans juge OK / sans tests verts / sans smoke-run

# ---- FIN DE TOUR (hook Stop) -------------------------------------------------
end-gate       = block   # MR mergée sans /end écrit dans le log du jour
closing-block  = block   # push sans BLOC DE CLÔTURE dans la réponse
jira-status    = block   # MR mergée sans ticket en « To Validate »
livrable       = block   # fin de /dev sans tableau LIVRABLE FINAL (Tradeoffs)

# ---- HYGIÈNE TRANSVERSE ------------------------------------------------------
tmp-ban        = block   # /tmp, /private/tmp, /var/folders (purgés par macOS)
quiet-hours    = block   # ré-invocation de Claude entre 20h00 et 07h00
external-lang  = block   # écriture JIRA/GitLab/Notion en français
skill-required = block   # éditer un .vue / un test / un contrat sans son skill
prose-required = warn    # écrire du code sans le skill claude-prose (rappel de la
                         # barre : clair, lisible, concis ; commentaires 0 par défaut)

# ---- PRÉ-ANALYSE -------------------------------------------------------------
# warn par défaut : un blocage casserait les sous-agents explorer/judge, qui
# grepent le repo et n'ont PAS le tool Skill pour lever l'exigence.
preanalysis    = warn    # explorer le monorepo sans skill/note de pré-analyse
